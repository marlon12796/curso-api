services:
  postgres:
    image: postgres:16-alpine
    container_name: curso-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: curso_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME:-postgres} -d curso_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${ECR_REPOSITORY_URL:-697961194138.dkr.ecr.us-east-1.amazonaws.com/curso-api}:${IMAGE_TAG:-latest}
    container_name: curso-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/curso_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-mi_clave_local_de_desarrollo_de_32_caracteres_minimo}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "3050:3050"

volumes:
  postgres_data:
