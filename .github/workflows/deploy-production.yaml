name: Deploy Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release a desplegar, por ejemplo v1.0.0'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: curso-api

jobs:
  test-release:
    name: Test release before deployment
    uses: ./.github/workflows/reusable-test.yaml
    permissions:
      contents: read

  deploy:
    name: Build and deploy release
    needs: test-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Show OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether release image already exists
        id: image
        env:
          IMAGE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La imagen $IMAGE_TAG ya existe; se reutilizará."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "La imagen $IMAGE_TAG no existe; se construirá."
          fi

      - name: Build and push release image
        if: steps.image.outputs.exists != 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          docker build \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy release through SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REPOSITORY_URL: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          bash .github/scripts/deploy-production.sh

      - name: Smoke test
        run: curl --fail --silent --show-error https://java.marloncloud.com/courses > /dev/null
