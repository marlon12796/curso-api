name: Tests

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.java-version'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'config/**'
      - 'infra/**'
      - 'Taskfile.yaml'
      - '.github/utils/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.java-version'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'config/**'
      - 'infra/**'
      - 'Taskfile.yaml'
      - '.github/utils/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run reusable tests
    uses: ./.github/workflows/reusable-test.yaml
    permissions:
      contents: read
