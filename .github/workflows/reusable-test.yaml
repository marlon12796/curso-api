name: Reusable Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests and quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: curso_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d curso_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven

      - name: Run tests and quality checks
        run: bash mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/curso_db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci_test_secret_must_have_at_least_32_characters
          JWT_EXPIRATION_MS: '3600000'
